[package]
name = "rquickjs-llrt-demo"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "rquickjs-llrt-demo"
repository = "https://github.com/ahaoboy/rquickjs-llrt-demo"
homepage = "https://github.com/ahaoboy/rquickjs-llrt-demo"
authors = ["ahaoboy"]

[dependencies]
# rquickjs = { version = "0.11", features = [
#   "loader", "std",
# ], git = "https://github.com/DelSkayn/rquickjs.git" }
# rquickjs = { features = [
#   "loader",
# ], default-features = false, git = "https://github.com/DelSkayn/rquickjs.git" }
rquickjs = { version = "0.11", features = ["loader"], default-features = false }
anyhow = "1"
llrt_modules = { git = "https://github.com/awslabs/llrt", features = [] }

[patch."https://github.com/DelSkayn/rquickjs"]
rquickjs = { version = "0.11" }

[profile.release]
debug = false
lto = true
strip = true
opt-level = "s"
codegen-units = 1
